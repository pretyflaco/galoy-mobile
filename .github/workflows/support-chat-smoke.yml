name: Support-chat smoke (Hermes)

# Req 10 (spec 03 §4): a device smoke test that starts a conversation on Hermes —
# a successful bundle proved nothing three times in the POC. Boots the emulator,
# runs a local wok relay, a throwaway roster + peer bot (all from THIS repo —
# scripts/support-chat-ci/), builds the app against them (ENVFILE), and drives the
# full loop via adb: onboard → nostr identity → start chat → greeting → send →
# live E2EE reply. Everything the job uses is throwaway, public data — no secrets.

on:
  pull_request:
    branches: [main, feat/support-chat]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  support-chat-smoke-android:
    name: Android (Hermes)
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/magic-nix-cache-action@v2
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-supportchat-deps-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-supportchat-deps-

      - name: Install Node modules
        run: nix develop -c yarn install
        env:
          LANG: en_US.UTF-8

      - name: Fetch wok and start the relay on :7777
        run: |
          cd scripts/support-chat-ci && ./fetch-wok.sh && cd ../..
          mkdir -p /tmp/wok-smoke-db
          nohup scripts/support-chat-ci/bin/wok --config scripts/support-chat-ci/wok.toml relay > /tmp/wok-smoke.log 2>&1 &
          echo $! > /tmp/wok-smoke.pid
          sleep 3
          tail -5 /tmp/wok-smoke.log

      - name: Smoke prep (throwaway roster + snapshot + env)
        run: nix develop -c node scripts/support-chat-ci/prep.mjs ws://10.0.2.2:7777 .env.support-smoke /tmp/support-chat-smoke-state

      - name: Build debug APK (ENVFILE=.env.support-smoke)
        run: |
          rm -rf android/app/.cxx
          nix develop -c sh -c 'unset ANDROID_SDK_ROOT; export ENVFILE=../../.env.support-smoke && yarn android:prepareAssets && ./android/gradlew -b ./android/build.gradle assembleDebug "-Dorg.gradle.jvmargs=-Xmx4g"'
        env:
          ENVFILE: .env.support-smoke

      - name: Start peer bot (local relay)
        run: |
          nohup nix develop -c node scripts/support-chat-ci/peer.mjs ws://127.0.0.1:7777 /tmp/support-chat-smoke-state/bot.json > /tmp/smoke-peer.log 2>&1 &
          echo $! > /tmp/smoke-peer.pid
          sleep 5
          grep -q "discovery published" /tmp/smoke-peer.log || (cat /tmp/smoke-peer.log && exit 1)

      - name: Boot emulator
        run: |
          nix develop -c sh -c 'emulator -avd Pixel_API_34 -gpu swiftshader -wipe-data -no-boot-anim' &
          nix develop -c adb wait-for-device
          nix develop -c sh -c 'adb shell while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'

      - name: Find the built APK
        run: |
          APK=$(find android/app/build/outputs/apk -name "*-debug.apk" | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          ls -la "$APK"

      - name: Drive the smoke (onboard → chat → round trip)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: nix develop -c node scripts/support-chat-ci/drive.mjs "$APK_PATH"

      - name: Artifacts
        if: always()
        run: |
          mkdir -p smoke-artifacts
          cp /tmp/wok-smoke.log /tmp/smoke-peer.log smoke-artifacts/ 2>/dev/null || true
          adb logcat -d -s ReactNativeJS > smoke-artifacts/app-logcat.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: support-chat-smoke
          path: smoke-artifacts

      - name: Cleanup
        if: always()
        continue-on-error: true
        run: |
          kill $(cat /tmp/smoke-peer.pid) 2>/dev/null || true
          kill $(cat /tmp/wok-smoke.pid) 2>/dev/null || true
          nix develop -c adb emu kill || true
