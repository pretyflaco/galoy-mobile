# iOS simulator smoke (Maestro) — the same loop as drive.mjs on Android:
# onboard (self-custodial) → nostr identity → support chat → start → the peer's
# live E2EE greeting → send → the peer's reply ON SCREEN. Selectors are testIDs
# (accessibilityIdentifier) or GaloyPrimaryButton titles (testProps(title)).
appId: io.galoy.bitcoinbeach
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible:
      id: "Create new account"
    timeout: 180000 # first launch: dev bundle from the .app, cold Hermes
- takeScreenshot: 01-get-started
- tapOn:
    id: "Create new account"
- tapOn:
    id: "self-custodial-option"
- tapOn:
    id: "continue-button"
- extendedWaitUntil:
    visible:
      id: "mode-enhanced"
    timeout: 30000
- tapOn:
    id: "mode-enhanced"
- tapOn:
    id: "choose-experience-continue"
- extendedWaitUntil:
    visible:
      id: "Accept"
    timeout: 60000
- takeScreenshot: 02-terms
- tapOn:
    id: "Accept"
- extendedWaitUntil:
    visible:
      id: "home-settings-button"
    timeout: 90000
- takeScreenshot: 03-home

# nostr identity (fresh install → no backed-up phrase → random key, auto-exit)
- tapOn:
    id: "home-settings-button"
- scrollUntilVisible:
    element:
      id: "Nostr identity"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "Nostr identity"
# The hub's empty state wraps its buttons in a testProps container
# ("nostr-identity-hub-empty": accessible + label), which on iOS hides the buttons
# from XCUITest (and VoiceOver) — so this is the one tap by position (the "Create
# new" button, 1st action under the hero; run 36850459669 screenshot).
- extendedWaitUntil:
    visible:
      id: "nostr-identity-hub-empty"
    timeout: 30000
- tapOn:
    point: "50%,32%"
- extendedWaitUntil:
    notVisible:
      text: "Generating…"
    timeout: 60000
- takeScreenshot: 04-identity

# back to home by relaunching (iOS has no hardware back), then settings → Support chat
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-settings-button"
    timeout: 90000
- tapOn:
    id: "home-settings-button"
- scrollUntilVisible:
    element:
      id: "Support chat"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "Support chat"
- extendedWaitUntil:
    visible:
      id: "support-chat-start"
    timeout: 60000
- takeScreenshot: 05-chat-screen

# start: roster gate → bot discovery → create + invite → peer Welcome → greeting
- tapOn:
    id: "support-chat-start"
- extendedWaitUntil:
    visible:
      id: "support-chat-input"
    timeout: 90000
- extendedWaitUntil:
    visible:
      text: ".*CI Smoke Bot joined.*"
    timeout: 90000
- takeScreenshot: 06-greeting

# send + the reply
- tapOn:
    id: "support-chat-input"
- inputText: "ci smoke roundtrip"
- hideKeyboard # the keyboard may cover the composer's Send (Android: ESC first, too)
- tapOn:
    id: "support-chat-send"
- extendedWaitUntil:
    visible:
      text: '.*copy "ci smoke roundtrip".*'
    timeout: 60000
- takeScreenshot: 07-reply
